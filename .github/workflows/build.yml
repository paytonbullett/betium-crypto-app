name: Build Betium Wallet APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP if project is packaged
        run: |
          # Preserve any existing production keystore
          if [ -f "production.keystore" ]; then
            cp production.keystore /tmp/production.keystore
            echo "Backed up production.keystore"
          fi

          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP archive: $ZIP_FILE. Extracting..."
            cp "$ZIP_FILE" /tmp/project.zip
            mkdir -p /tmp/workflows
            cp -r .github/workflows/* /tmp/workflows/ 2>/dev/null || true

            find . -maxdepth 1 -not -name '.git' -not -name '.' -not -name '..' -exec rm -rf {} +
            unzip -q -o /tmp/project.zip -d .
            mkdir -p .github/workflows
            cp -r /tmp/workflows/* .github/workflows/ 2>/dev/null || true
          fi

          if [ -f "/tmp/production.keystore" ]; then
            cp /tmp/production.keystore production.keystore
            echo "Restored production.keystore to root directory"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Environment & Accept Licenses
        run: |
          # GitHub Actions ubuntu-latest runners have Android SDK pre-installed at /usr/local/lib/android/sdk
          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
          elif [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          else
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi

          echo "Detected Android SDK location: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV

          # Pre-accept all standard and preview Android SDK licenses so Gradle can auto-download components
          mkdir -p "$SDK_ROOT/licenses"
          printf "\n24333f8a63b682429dd44c1a62f4965e17ab2040\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n5046274c4602e5178737f5bd2e0e5de65029c924" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          printf "\n33b6a2b64920402e245a4a58ff0d6e6480c558c7" > "$SDK_ROOT/licenses/google-gdk-license"

          # Add sdkmanager to PATH if available, and run license accept
          SDKM=$(find "$SDK_ROOT/cmdline-tools" -name "sdkmanager" 2>/dev/null | head -n 1)
          if [ -n "$SDKM" ]; then
            echo "$(dirname "$SDKM")" >> $GITHUB_PATH
            yes 2>/dev/null | "$SDKM" --licenses 2>/dev/null || true
          fi

      - name: Prepare Secrets & Environment Files
        run: |
          # Secrets Gradle Plugin requires both .env and .env.example
          touch .env .env.example
          if [ ! -s .env ]; then
            echo "# Auto-generated CI environment" > .env
          fi

      - name: Ensure Gradle Wrapper is Ready
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found and made executable."
          else
            echo "Gradle wrapper not found. Installing Gradle and generating wrapper..."
            curl -sSL -o gradle-bin.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
            unzip -q gradle-bin.zip -d /tmp/gradle
            GRADLE_HOME=$(find /tmp/gradle -maxdepth 1 -type d -name "gradle-*" | head -n 1)
            export PATH="$GRADLE_HOME/bin:$PATH"
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: Generate Compatible google-services.json
        run: |
          # Extract the exact package name/applicationId from app/build.gradle.kts
          APP_ID=$(grep -o 'applicationId = "[^"]*"' app/build.gradle.kts 2>/dev/null | head -n1 | cut -d'"' -f2)
          if [ -z "$APP_ID" ]; then
            APP_ID=$(grep -o 'namespace = "[^"]*"' app/build.gradle.kts 2>/dev/null | head -n1 | cut -d'"' -f2)
          fi
          APP_ID=${APP_ID:-"org.betiumcrypto.wallet"}
          echo "Detected Application ID: $APP_ID"

          mkdir -p app/src/debug app/src/release
          cat > app/google-services.json << EOF
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "bullettsocial-app",
              "storage_bucket": "bullettsocial-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:bullettsocial",
                  "android_client_info": {
                    "package_name": "$APP_ID"
                  }
                },
                "api_key": [{ "current_key": "dummy-api-key" }],
                "services": {
                  "appinvite_service": { "status": 1 }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:fallback",
                  "android_client_info": {
                    "package_name": "app.bullettsocial.space"
                  }
                },
                "api_key": [{ "current_key": "dummy-api-key" }],
                "services": {
                  "appinvite_service": { "status": 1 }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          cp app/google-services.json app/src/debug/
          cp app/google-services.json app/src/release/

      - name: Prepare Signing Keystore
        env:
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'android' }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || 'android' }}
          ALIAS_NAME: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: |
          # Determine active keystore file
          KEYSTORE_FILE=""
          if [ -f "production.keystore" ]; then
            KEYSTORE_FILE="production.keystore"
          elif [ -f "my-upload-key.jks" ]; then
            KEYSTORE_FILE="my-upload-key.jks"
          fi

          # If no keystore exists, generate a valid temporary release keystore
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "No existing keystore found. Generating release keystore: my-upload-key.jks"
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -alias "$ALIAS_NAME" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=BullettSocial, OU=Mobile, O=BullettSocial, L=City, S=State, C=US"
            KEYSTORE_FILE="my-upload-key.jks"
          fi

          echo "Using keystore: $KEYSTORE_FILE"
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=$ALIAS_NAME" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          BUILD_CMD="./gradlew"
          if [ ! -f "$BUILD_CMD" ]; then
            BUILD_CMD="gradle"
          fi

          echo "Executing release build..."
          $BUILD_CMD assembleRelease --info --stacktrace \
            -Pandroid.builder.sdkDownload=true \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload Compilation Failure Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-failure-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
            build/reports/
          overwrite: true
          if-no-files-found: ignore

      - name: Prepare Outputs
        run: |
          mkdir -p output

          echo "Available APK files:"
          find app/build/outputs/ -type f -name "*.apk" 2>/dev/null || true

          # Find release APK or fallback to any generated APK
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -n "$RELEASE_APK" ]; then
            echo "Copying $RELEASE_APK to output/betium-wallet.apk"
            cp "$RELEASE_APK" output/betium-wallet.apk
          else
            echo "Error: No APK found after build!"
            exit 1
          fi

          if [ -f "production.keystore" ]; then
            cp production.keystore output/production.keystore
          elif [ -f "my-upload-key.jks" ]; then
            cp my-upload-key.jks output/production.keystore
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: betium-wallet-apk
          path: output/betium-wallet.apk
          overwrite: true
          if-no-files-found: error

      - name: Upload Keystore Artifact (if present)
        uses: actions/upload-artifact@v4
        with:
          name: production-keystore
          path: output/production.keystore
          overwrite: true
          if-no-files-found: ignore
